<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PrintEase — Project Roadmap</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --border: #1e1e2e;
    --accent: #00ff88;
    --accent2: #ff6b35;
    --accent3: #7c3aed;
    --text: #e8e8f0;
    --muted: #555570;
    --done-bg: #0d1f14;
    --done-border: #1a3d28;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 48px 24px 80px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  .header {
    margin-bottom: 56px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(0,255,136,0.08);
    border: 1px solid rgba(0,255,136,0.2);
    color: var(--accent);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    padding: 6px 14px;
    border-radius: 2px;
    margin-bottom: 20px;
  }

  .badge::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  h1 {
    font-size: clamp(36px, 6vw, 58px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -2px;
    margin-bottom: 12px;
  }

  h1 span {
    color: var(--accent);
  }

  .subtitle {
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.5px;
  }

  /* Progress Overview */
  .progress-bar-wrap {
    margin: 32px 0 8px;
    background: var(--border);
    border-radius: 2px;
    height: 4px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #00cc6a);
    border-radius: 2px;
    transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
  }

  .progress-stats {
    display: flex;
    justify-content: space-between;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-top: 8px;
  }

  .progress-stats .count {
    color: var(--accent);
    font-weight: 700;
  }

  /* Phase cards */
  .phase {
    margin-bottom: 32px;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    transition: border-color 0.3s;
  }

  .phase:hover {
    border-color: #2a2a3e;
  }

  .phase-header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 20px 24px;
    cursor: pointer;
    user-select: none;
    background: var(--surface);
    transition: background 0.2s;
  }

  .phase-header:hover {
    background: #16161f;
  }

  .phase-number {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    min-width: 28px;
  }

  .phase-icon {
    font-size: 20px;
    min-width: 28px;
    text-align: center;
  }

  .phase-title-wrap {
    flex: 1;
  }

  .phase-title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }

  .phase-meta {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    margin-top: 3px;
  }

  .phase-pill {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    padding: 4px 10px;
    border-radius: 2px;
    border: 1px solid;
    letter-spacing: 1px;
    white-space: nowrap;
  }

  .pill-todo   { color: var(--muted);   border-color: var(--muted);   background: transparent; }
  .pill-active { color: var(--accent2); border-color: var(--accent2); background: rgba(255,107,53,0.07); }
  .pill-done   { color: var(--accent);  border-color: var(--accent);  background: rgba(0,255,136,0.07); }

  .phase-toggle {
    font-size: 16px;
    color: var(--muted);
    transition: transform 0.3s, color 0.2s;
  }

  .phase.open .phase-toggle {
    transform: rotate(180deg);
    color: var(--accent);
  }

  .phase-progress-mini {
    height: 2px;
    background: var(--border);
  }

  .phase-progress-mini-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.4s ease;
  }

  /* Task list */
  .tasks {
    display: none;
    padding: 8px 0 16px;
    background: var(--bg);
  }

  .phase.open .tasks {
    display: block;
    animation: slideDown 0.25s ease;
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .task {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 13px 24px;
    cursor: pointer;
    transition: background 0.15s;
    border-left: 2px solid transparent;
  }

  .task:hover {
    background: rgba(255,255,255,0.02);
    border-left-color: var(--accent);
  }

  .task.done {
    background: var(--done-bg);
    border-left-color: var(--accent);
  }

  .task-check {
    width: 18px;
    height: 18px;
    border: 1.5px solid var(--muted);
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 2px;
    transition: all 0.2s;
  }

  .task.done .task-check {
    background: var(--accent);
    border-color: var(--accent);
  }

  .task-check-icon {
    display: none;
    color: #000;
    font-size: 11px;
    font-weight: 900;
  }

  .task.done .task-check-icon {
    display: block;
  }

  .task-content {
    flex: 1;
  }

  .task-label {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
    transition: color 0.2s;
  }

  .task.done .task-label {
    color: var(--muted);
    text-decoration: line-through;
    text-decoration-color: rgba(0,255,136,0.4);
  }

  .task-note {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    margin-top: 3px;
    line-height: 1.5;
  }

  .task-tag {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    padding: 2px 7px;
    border-radius: 2px;
    margin-left: 8px;
    vertical-align: middle;
  }

  .tag-hw  { background: rgba(124,58,237,0.15); color: #a78bfa; }
  .tag-sw  { background: rgba(59,130,246,0.15); color: #60a5fa; }
  .tag-biz { background: rgba(255,107,53,0.15); color: #fb923c; }
  .tag-ops { background: rgba(234,179,8,0.15);  color: #fbbf24; }

  /* Section divider inside tasks */
  .task-group-label {
    padding: 12px 24px 6px;
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    border-top: 1px solid var(--border);
    margin-top: 4px;
  }

  .task-group-label:first-child {
    border-top: none;
    margin-top: 0;
  }

  /* Footer */
  .footer {
    margin-top: 48px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  .footer .logo {
    color: var(--accent);
    font-weight: 700;
    font-size: 13px;
  }

  /* Reset button */
  .reset-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    padding: 6px 14px;
    border-radius: 2px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.2s;
  }

  .reset-btn:hover {
    border-color: var(--accent2);
    color: var(--accent2);
  }

  /* Confetti-style completion flash */
  @keyframes completionFlash {
    0%   { box-shadow: 0 0 0 0 rgba(0,255,136,0.4); }
    70%  { box-shadow: 0 0 0 10px rgba(0,255,136,0); }
    100% { box-shadow: 0 0 0 0 rgba(0,255,136,0); }
  }

  .task.just-done {
    animation: completionFlash 0.6s ease;
  }
</style>

// ── Supabase helpers (no SDK needed — plain fetch) ────────
async function sbGet(key) {
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/checklist?id=eq.${encodeURIComponent(key)}&select=done`,
    { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
  );
  const rows = await res.json();
  return rows.length ? rows[0].done : null;
}

async function sbUpsert(key, done) {
  await fetch(`${SUPABASE_URL}/rest/v1/checklist`, {
    method: 'POST',
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      Prefer: 'resolution=merge-duplicates',
    },
    body: JSON.stringify({ id: key, done, updated_at: new Date().toISOString() }),
  });
}

async function sbLoadAll() {
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/checklist?select=id,done`,
    { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
  );
  if (!res.ok) {
    const body = await res.text();
    throw new Error(`HTTP ${res.status}: ${body}`);
  }
  const rows = await res.json();
  const map = {};
  rows.forEach(r => { map[r.id] = r.done; });
  return map;
}

async function sbDeleteAll() {
  await fetch(`${SUPABASE_URL}/rest/v1/checklist?id=neq.___never___`, {
    method: 'DELETE',
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` },
  });
}

// ── State — localStorage as instant cache, Supabase as source of truth ──
let state = {};

function applyLocalCache() {
  try {
    const cached = JSON.parse(localStorage.getItem('printease_cache')) || {};
    state = cached;
  } catch { state = {}; }
}

function writeLocalCache() {
  try { localStorage.setItem('printease_cache', JSON.stringify(state)); } catch {}
}

async function initState() {
  showSyncBadge('loading');
  applyLocalCache();   // instant paint from cache
  render();
  try {
    const remote = await sbLoadAll();
    state = { ...state, ...remote };
    writeLocalCache();
    render();
    showSyncBadge('synced');
  } catch(e) {
    showSyncBadge('offline');
    console.error('Supabase load failed — full error:', e.message);
  }
}

async function saveKey(key, value) {
  state[key] = value;
  writeLocalCache();
  try {
    await sbUpsert(key, value);
    showSyncBadge('synced');
  } catch(e) {
    showSyncBadge('offline');
    console.warn('Supabase save failed', e);
  }
}

// ── Render ───────────────────────────────────────────────
function render() {
  const container = document.getElementById('phases');
  container.innerHTML = '';

  PHASES.forEach((phase, pi) => {
    const taskItems = phase.tasks.filter(t => !t.group);
    const doneCount = taskItems.filter((_, ti) => {
      const key = `${pi}-${realIndex(phase.tasks, ti)}`;
      return state[key];
    }).length;
    const total = taskItems.length;
    const pct = total ? Math.round(doneCount / total * 100) : 0;

    const status = pct === 100 ? 'done' : doneCount > 0 ? 'active' : 'todo';
    const pillText = pct === 100 ? 'DONE' : doneCount > 0 ? 'IN PROGRESS' : 'TODO';
    const pillClass = pct === 100 ? 'pill-done' : doneCount > 0 ? 'pill-active' : 'pill-todo';

    const isOpen = state[`open_${pi}`] !== false; // default open

    const phaseEl = document.createElement('div');
    phaseEl.className = `phase ${isOpen ? 'open' : ''}`;
    phaseEl.dataset.phase = pi;

    let tasksHTML = '';
    let taskCounter = 0;
    phase.tasks.forEach((t, idx) => {
      if (t.group) {
        tasksHTML += `<div class="task-group-label">${t.group}</div>`;
        return;
      }
      const key = `${pi}-${idx}`;
      const done = !!state[key];
      const tagHTML = t.tag ? `<span class="task-tag tag-${t.tag}">${t.tag.toUpperCase()}</span>` : '';
      tasksHTML += `
        <div class="task ${done ? 'done' : ''}" data-key="${key}" onclick="toggleTask('${key}', this)">
          <div class="task-check">
            <span class="task-check-icon">✓</span>
          </div>
          <div class="task-content">
            <div class="task-label">${t.label}${tagHTML}</div>
            ${t.note ? `<div class="task-note">${t.note}</div>` : ''}
          </div>
        </div>`;
      taskCounter++;
    });

    phaseEl.innerHTML = `
      <div class="phase-header" onclick="togglePhase(${pi}, this.closest('.phase'))">
        <span class="phase-number">${String(pi+1).padStart(2,'0')}</span>
        <span class="phase-icon">${phase.icon}</span>
        <div class="phase-title-wrap">
          <div class="phase-title">${phase.title}</div>
          <div class="phase-meta">${phase.meta} &nbsp;·&nbsp; ${doneCount}/${total} tasks</div>
        </div>
        <span class="phase-pill ${pillClass}">${pillText}</span>
        <span class="phase-toggle">▾</span>
      </div>
      <div class="phase-progress-mini">
        <div class="phase-progress-mini-fill" style="width:${pct}%"></div>
      </div>
      <div class="tasks">${tasksHTML}</div>
    `;

    container.appendChild(phaseEl);
  });

  updateGlobal();
}

function realIndex(tasks, taskIdx) {
  let count = 0;
  for (let i = 0; i < tasks.length; i++) {
    if (tasks[i].group) continue;
    if (count === taskIdx) return i;
    count++;
  }
  return taskIdx;
}

function toggleTask(key, el) {
  state[key] = !state[key];
  saveKey(key, state[key]);
  if (state[key]) {
    el.classList.add('done', 'just-done');
    setTimeout(() => el.classList.remove('just-done'), 700);
  } else {
    el.classList.remove('done');
  }
  // Update phase progress
  const pi = parseInt(key.split('-')[0]);
  const phase = PHASES[pi];
  const taskItems = phase.tasks.filter(t => !t.group);
  const doneCount = taskItems.filter((_, ti) => {
    const k = `${pi}-${realIndex(phase.tasks, ti)}`;
    return state[k];
  }).length;
  const total = taskItems.length;
  const pct = Math.round(doneCount / total * 100);

  // Update mini progress bar
  const phaseEl = document.querySelector(`.phase[data-phase="${pi}"]`);
  if (phaseEl) {
    phaseEl.querySelector('.phase-progress-mini-fill').style.width = pct + '%';
    const meta = phaseEl.querySelector('.phase-meta');
    const parts = meta.textContent.split('·');
    meta.innerHTML = `${parts[0].trim()} &nbsp;·&nbsp; ${parts[1].trim()} &nbsp;·&nbsp; ${doneCount}/${total} tasks`;

    // Update pill
    const pill = phaseEl.querySelector('.phase-pill');
    const status = pct === 100 ? 'done' : doneCount > 0 ? 'active' : 'todo';
    pill.className = `phase-pill ${pct===100?'pill-done':doneCount>0?'pill-active':'pill-todo'}`;
    pill.textContent = pct === 100 ? 'DONE' : doneCount > 0 ? 'IN PROGRESS' : 'TODO';
  }

  updateGlobal();
}

function togglePhase(pi, el) {
  el.classList.toggle('open');
  const k = `open_${pi}`;
  state[k] = el.classList.contains('open');
  saveKey(k, state[k]);
}

function updateGlobal() {
  let total = 0, done = 0;
  PHASES.forEach((phase, pi) => {
    phase.tasks.forEach((t, idx) => {
      if (t.group) return;
      total++;
      if (state[`${pi}-${idx}`]) done++;
    });
  });
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('globalFill').style.width = pct + '%';
  document.getElementById('doneCount').textContent = done;
  document.getElementById('pctCount').textContent = pct + '%';
}

async function resetAll() {
  if (!confirm('Reset all progress? This cannot be undone.')) return;
  state = {};
  writeLocalCache();
  try {
    await sbDeleteAll();
    showSyncBadge('synced');
  } catch(e) {
    showSyncBadge('offline');
  }
  render();
}

// ── Sync badge ────────────────────────────────────────────
function showSyncBadge(status) {
  let badge = document.getElementById('syncBadge');
  if (!badge) return;
  const map = {
    loading: ['⟳ SYNCING',   '#555570'],
    synced:  ['✓ SYNCED',    '#00ff88'],
    offline: ['⚠ OFFLINE',   '#ff6b35'],
  };
  const [text, color] = map[status] || map.offline;
  badge.textContent = text;
  badge.style.color = color;
  badge.style.borderColor = color;
}

// Init
initState();
</script>
